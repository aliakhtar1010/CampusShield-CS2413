
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusShield - Academic Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        h1 {
            color: #17365d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #17365d;
            color: white;
        }
    </style>
</head>
<body>
    <h1>CampusShield</h1>
    <h2>Student Academic Records</h2>

    <p>Demonstration account: student01</p>

    <table>
        <tr>
            <th>Course Code</th>
            <th>Course Title</th>
            <th>Grade</th>
        </tr>

        {% for record in records %}
        <tr>
            <td>{{ record["course_code"] }}</td>
            <td>{{ record["course_title"] }}</td>
            <td>{{ record["grade"] }}%</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/">Back to Home</a></p>
</body>
</html>
