
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusShield | Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 340px;
            border-radius: 10px;
            box-shadow: 0 4px 20px #0002;
        }

        h1 { color: #17365d; }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #17365d;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error { color: #b42318; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>CampusShield</h1>
        <p>Academic Records Portal</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username"
                   name="username"
                   required
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   name="password"
                   required
                   autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
