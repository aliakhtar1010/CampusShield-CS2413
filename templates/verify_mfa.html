
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusShield | MFA Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .card {
            width: 390px;
            max-width: 92%;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.09);
        }

        h1 {
            color: #17365d;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 19px;
            color: #26384f;
        }

        p {
            color: #526174;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 22px 0 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 24px;
            letter-spacing: 7px;
            text-align: center;
            border: 1px solid #b7c4d5;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #254f7e;
        }

        .error {
            color: #b42318;
            background: #fff0ee;
            padding: 12px;
            border-radius: 6px;
        }

        .notice {
            background: #edf3fa;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>CampusShield</h1>
        <h2>Two-Factor Authentication</h2>

        <p>
            Enter the six-digit security code from
            your authenticator application.
        </p>

        <div class="notice">
            MFA is required for instructor and
            security administrator accounts.
        </div>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST"
              action="{{ url_for('verify_mfa') }}">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="code">
                Authentication Code
            </label>

            <input
                type="text"
                id="code"
                name="code"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                minlength="6"
                maxlength="6"
                placeholder="000000"
                required
                autofocus
            >

            <button type="submit">
                Verify & Continue
            </button>
        </form>

        <p class="footer">
            CS2413 Information Security | Team 14
        </p>
    </div>
</body>
</html>
